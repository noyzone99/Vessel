name: Validate Vessel

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read and check the Vessel version
        id: version
        shell: bash
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("Directory.Build.props").findtext("PropertyGroup/Version"))')
          java_version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("Bindings/java/pom.xml").findtext("{*}version"))')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid Vessel version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the Vessel version v$version" >&2
            exit 1
          fi
          if [[ "$java_version" != "$version" ]]; then
            echo "Java version $java_version does not match the Vessel version $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  validate:
    needs: version
    strategy:
      fail-fast: false
      matrix: &native-matrix
        include:
          - os: windows-2022
            rid: win-x64
            target: windows-x64
            library: vessel.dll
          - os: windows-11-vs2026-arm
            rid: win-arm64
            target: windows-arm64
            library: vessel.dll
          - os: ubuntu-24.04
            rid: linux-x64
            target: linux-glibc-x64
            library: libvessel.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            target: linux-glibc-arm64
            library: libvessel.so
          - os: ubuntu-24.04
            rid: linux-musl-x64
            target: linux-musl-x64
            library: libvessel.so
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
            target: linux-musl-arm64
            library: libvessel.so
          - os: macos-15-intel
            rid: osx-x64
            target: macos-x64
            library: libvessel.dylib
          - os: macos-15
            rid: osx-arm64
            target: macos-arm64
            library: libvessel.dylib
    runs-on: ${{ matrix.os }}
    env:
      VESSEL_RID: ${{ matrix.rid }}
      VESSEL_LIBRARY: ${{ matrix.library }}
      VESSEL_BUILD_DIR: Sources/Vessel.Native/bin/Release/net11.0/${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        if: ${{ !contains(matrix.rid, '-musl-') }}
        with:
          dotnet-version: 11.0.x
          architecture: ${{ endsWith(matrix.rid, '-arm64') && 'arm64' || 'x64' }}
      - uses: actions/setup-python@v6
        if: ${{ !contains(matrix.rid, '-musl-') }}
        with:
          python-version: '3.13'
          architecture: ${{ endsWith(matrix.rid, '-arm64') && 'arm64' || 'x64' }}
      - name: Install Ubuntu NativeAOT prerequisites
        if: runner.os == 'Linux' && !contains(matrix.rid, '-musl-')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang patchelf zlib1g-dev
      - name: Build and test .NET
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64'
        run: |
          dotnet build Vessel.slnx -c Release
          dotnet test --project Tests/Vessel.UnitTests -c Release --no-build
          dotnet pack Sources/Vessel -c Release --no-build -m:1
      - name: Publish the native library
        if: ${{ !contains(matrix.rid, '-musl-') }}
        run: dotnet publish Sources/Vessel.Native -c Release -r ${{ matrix.rid }}
      - name: Test C and Python clients on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $build = (Resolve-Path $env:VESSEL_BUILD_DIR).Path
          $publish = (Resolve-Path (Join-Path $build 'publish')).Path
          $binary = Join-Path $publish $env:VESSEL_LIBRARY
          python Tests/Vessel.Native.Tests/smoke.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = (Resolve-Path 'Bindings/python/src').Path
          $env:VESSEL_LIBRARY_PATH = $binary
          python -m unittest discover -s Bindings/python/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $architecture = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'amd64' }
          $component = if ($architecture -eq 'arm64') {
              'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
          } else {
              'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires $component -property installationPath
          $devShell = Join-Path $visualStudio 'Common7/Tools/Launch-VsDevShell.ps1'
          & $devShell -Arch $architecture -HostArch $architecture -SkipAutomaticLocation

          if ($env:VESSEL_RID -eq 'win-x64') {
              python .github/scripts/build_static_native.py win-x64 artifacts/native-static
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $source = 'Tests/Vessel.Native.Tests/smoke.c'
          $store = Join-Path $env:RUNNER_TEMP 'vessel-c-store'
          $executable = Join-Path $env:RUNNER_TEMP 'vessel-c-smoke.exe'
          $object = Join-Path $env:RUNNER_TEMP 'vessel-c-smoke.obj'
          $import = Join-Path $build 'native/vessel.lib'
          $env:PATH = $publish + [IO.Path]::PathSeparator + $env:PATH
          cl.exe /nologo /std:c11 /W4 /WX "/I$publish" "/Fe$executable" "/Fo$object" $source $import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $executable $store
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $import -Destination $publish
      - name: Test C and Python clients on glibc and macOS
        if: runner.os != 'Windows' && !contains(matrix.rid, '-musl-')
        run: sh Tests/Vessel.Native.Tests/smoke.sh "$VESSEL_BUILD_DIR/publish/$VESSEL_LIBRARY"
      - name: Build and test the static library on Linux glibc x64
        if: matrix.rid == 'linux-x64'
        run: python .github/scripts/build_static_native.py linux-x64 artifacts/native-static
      - name: Build and test the musl library in Alpine
        if: contains(matrix.rid, '-musl-')
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src" \
            --workdir /src \
            --env VESSEL_RID --env VESSEL_BUILD_DIR --env VESSEL_LIBRARY \
            mcr.microsoft.com/dotnet/sdk:11.0-alpine-aot sh -ec '
              apk add --no-cache clang python3 py3-pip patchelf
              dotnet publish Sources/Vessel.Native -c Release -r "$VESSEL_RID"
              sh Tests/Vessel.Native.Tests/smoke.sh "$VESSEL_BUILD_DIR/publish/$VESSEL_LIBRARY"
              cp LICENSE "$VESSEL_BUILD_DIR/publish/"
              python3 .github/scripts/build_python_wheel.py "$VESSEL_RID" "$VESSEL_BUILD_DIR/publish/$VESSEL_LIBRARY" artifacts/wheels
            '
      - name: Build and test the bundled Python wheel
        if: ${{ !contains(matrix.rid, '-musl-') }}
        run: python .github/scripts/build_python_wheel.py ${{ matrix.rid }} "${{ env.VESSEL_BUILD_DIR }}/publish/${{ matrix.library }}" artifacts/wheels
      - name: Upload the tested Python wheel
        uses: actions/upload-artifact@v6
        with:
          name: vessel-wheel-${{ matrix.rid }}-${{ needs.version.outputs.value }}
          path: artifacts/wheels/*.whl
          if-no-files-found: error
          overwrite: true
      - name: Add the license to the native package
        if: ${{ !contains(matrix.rid, '-musl-') }}
        shell: pwsh
        run: Copy-Item -LiteralPath LICENSE -Destination "$env:VESSEL_BUILD_DIR/publish/"
      - name: Upload the tested dynamic library
        uses: actions/upload-artifact@v6
        with:
          name: vessel-native-dynamic-${{ matrix.target }}-${{ needs.version.outputs.value }}
          path: |
            ${{ env.VESSEL_BUILD_DIR }}/publish/${{ matrix.library }}
            ${{ env.VESSEL_BUILD_DIR }}/publish/vessel.h
            ${{ env.VESSEL_BUILD_DIR }}/publish/vessel.lib
            ${{ env.VESSEL_BUILD_DIR }}/publish/LICENSE
          if-no-files-found: error
          overwrite: true
      - name: Upload the tested static library
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v6
        with:
          name: vessel-native-static-${{ matrix.target }}-${{ needs.version.outputs.value }}
          path: artifacts/native-static/
          if-no-files-found: error
          overwrite: true
      - name: Run the quick benchmark profile
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64'
        run: dotnet run --project Tests/Vessel.Benchmark -c Release --no-build -- --quick
      - name: Upload the NuGet package
        if: github.ref_type == 'tag' && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v6
        with:
          name: vessel-nuget-${{ needs.version.outputs.value }}
          path: Sources/Vessel/bin/Release/Packages/VesselStorage.${{ needs.version.outputs.value }}.nupkg
          if-no-files-found: error
          overwrite: true

  java-package:
    needs: [version, validate]
    runs-on: ubuntu-24.04
    env:
      VESSEL_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v7
        with:
          pattern: vessel-native-dynamic-*
          path: artifacts/ci
      - name: Build and verify the Java JAR
        run: |
          python3 .github/scripts/stage_java_natives.py artifacts/ci "$VESSEL_VERSION" --stage artifacts/java-natives
          mvn -B -ntp -f Bindings/java/pom.xml clean install
          jar="Bindings/java/target/vessel-storage-$VESSEL_VERSION.jar"
          python3 .github/scripts/stage_java_natives.py artifacts/ci "$VESSEL_VERSION" --check "$jar"
      - name: Test the Maven consumer
        run: mvn -B -ntp -f Examples/java/pom.xml -Dvessel.version="$VESSEL_VERSION" compile exec:exec
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Test the Gradle consumer
        run: gradle --no-daemon -p Examples/java -PvesselLocal -PvesselVersion="$VESSEL_VERSION" run
      - name: Stage Maven artifacts
        run: |
          mkdir -p artifacts/java-package
          cp Bindings/java/target/vessel-storage-"$VESSEL_VERSION"*.jar artifacts/java-package/
          cp Bindings/java/pom.xml "artifacts/java-package/vessel-storage-$VESSEL_VERSION.pom"
      - uses: actions/upload-artifact@v6
        with:
          name: vessel-java-${{ needs.version.outputs.value }}
          path: artifacts/java-package/
          if-no-files-found: error
          overwrite: true

  java-test:
    name: Java JAR (${{ matrix.target }})
    needs: [version, java-package]
    strategy:
      fail-fast: false
      matrix: *native-matrix
    runs-on: ${{ matrix.os }}
    env:
      VESSEL_JAR: artifacts/java-package/vessel-storage-${{ needs.version.outputs.value }}.jar
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: vessel-java-${{ needs.version.outputs.value }}
          path: artifacts/java-package
      - uses: actions/setup-java@v6
        if: ${{ !contains(matrix.target, '-musl-') }}
        with:
          distribution: ${{ matrix.target == 'windows-arm64' && 'microsoft' || 'temurin' }}
          java-version: '25'
          architecture: ${{ endsWith(matrix.target, '-arm64') && 'aarch64' || 'x64' }}
      - name: Run the packaged smoke test
        if: ${{ !contains(matrix.target, '-musl-') }}
        shell: bash
        run: |
          java --enable-native-access=ALL-UNNAMED --illegal-native-access=deny \
            --class-path "$VESSEL_JAR" Bindings/java/src/test/java/Smoke.java
      - name: Run the packaged smoke test in Alpine
        if: contains(matrix.target, '-musl-')
        run: |
          docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --workdir /src eclipse-temurin:25-jdk-alpine \
            java --enable-native-access=ALL-UNNAMED --illegal-native-access=deny \
            --class-path "$VESSEL_JAR" Bindings/java/src/test/java/Smoke.java

  package-release:
    if: github.ref_type == 'tag'
    needs: [version, validate, java-package, java-test]
    runs-on: ubuntu-24.04
    env:
      VESSEL_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          pattern: vessel-*
          path: artifacts/ci
      - name: Build and check release packages
        shell: bash
        run: |
          mkdir -p artifacts/release
          cp "artifacts/ci/vessel-nuget-$VESSEL_VERSION/VesselStorage.$VESSEL_VERSION.nupkg" artifacts/release/
          cp "artifacts/ci/vessel-java-$VESSEL_VERSION/"* artifacts/release/
          python -m pip install packaging
          python .github/scripts/package-native-release.py artifacts/ci artifacts/release "$VESSEL_VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: vessel-release-${{ needs.version.outputs.value }}
          path: artifacts/release/
          if-no-files-found: error
          overwrite: true

  github-release:
    needs: [version, package-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: vessel-release-${{ needs.version.outputs.value }}
          path: artifacts/release
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${options[@]}"

  publish-nuget:
    needs: [version, github-release]
    runs-on: ubuntu-24.04
    environment: nuget
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v7
        with:
          name: vessel-nuget-${{ needs.version.outputs.value }}
          path: artifacts/nuget
      - name: Publish VesselStorage to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/nuget/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-pypi:
    needs: [version, github-release]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: vessel-release-${{ needs.version.outputs.value }}
          path: artifacts/release
      - name: Stage the Python wheels
        run: |
          mkdir -p dist
          cp artifacts/release/*.whl dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  stage-maven-central:
    if: vars.MAVEN_CENTRAL_ENABLED == 'true'
    needs: [version, github-release]
    runs-on: ubuntu-24.04
    environment: maven-central
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: vessel-java-${{ needs.version.outputs.value }}
          path: artifacts/java-package
      - name: Sign and stage the tested Maven artifacts
        shell: bash
        env:
          VESSEL_VERSION: ${{ needs.version.outputs.value }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.CENTRAL_GPG_PRIVATE_KEY }}
          CENTRAL_GPG_PASSPHRASE: ${{ secrets.CENTRAL_GPG_PASSPHRASE }}
        run: |
          : "${CENTRAL_USERNAME:?}" "${CENTRAL_PASSWORD:?}" "${CENTRAL_GPG_PRIVATE_KEY:?}" "${CENTRAL_GPG_PASSPHRASE:?}"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$CENTRAL_GPG_PRIVATE_KEY" | gpg --batch --import
          path="io/github/noyzone99/vessel-storage/$VESSEL_VERSION"
          mkdir -p "artifacts/central/$path"
          base="vessel-storage-$VESSEL_VERSION"
          for file in "$base.jar" "$base-sources.jar" "$base-javadoc.jar" "$base.pom"; do
            cp "artifacts/java-package/$file" "artifacts/central/$path/"
            asset="artifacts/central/$path/$file"
            printf '%s\n' "$CENTRAL_GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign "$asset"
            md5sum "$asset" | cut -d ' ' -f1 > "$asset.md5"
            sha1sum "$asset" | cut -d ' ' -f1 > "$asset.sha1"
          done
          (cd artifacts/central && zip -rq ../central.zip io)
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          echo "::add-mask::$token"
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $token" \
            --form bundle=@artifacts/central.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=$base&publishingType=USER_MANAGED"
